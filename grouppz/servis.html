<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servisní hlášení</title>

    <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
    <script src="https://unpkg.com/docxtemplater@3.37.11/build/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

    </style>
</head>
<body>

<div class="container">

    <h1>Servisní hlášení</h1>

    <label>Číslo v excelu</label>
    <input type="text" id="cislo_excel" placeholder="69" required>

    <label>Jméno zákazníka</label>
    <input type="text" id="zakaznik" placeholder="Jan Novák" required>

    <label>E-mail</label>
    <input type="email" id="email" placeholder="novak@gmail.com" required>

    <label>Telefon</label>

    <div style="display:flex; gap:10px; align-items:center;">

        <select id="predvolba" style="max-width:220px;">

            <option value="+30">🇬🇷 Řecko (+30)</option>
            <option value="+31">🇳🇱 Nizozemsko (+31)</option>
            <option value="+32">🇧🇪 Belgie (+32)</option>
            <option value="+33">🇫🇷 Francie (+33)</option>
            <option value="+34">🇪🇸 Španělsko (+34)</option>
            <option value="+36">🇭🇺 Maďarsko (+36)</option>
            <option value="+39">🇮🇹 Itálie (+39)</option>
            <option value="+40">🇷🇴 Rumunsko (+40)</option>
            <option value="+41">🇨🇭 Švýcarsko (+41)</option>
            <option value="+43">🇦🇹 Rakousko (+43)</option>
            <option value="+45">🇩🇰 Dánsko (+45)</option>
            <option value="+46">🇸🇪 Švédsko (+46)</option>
            <option value="+47">🇳🇴 Norsko (+47)</option>
            <option value="+48">🇵🇱 Polsko (+48)</option>
            <option value="+49">🇩🇪 Německo (+49)</option>
            <option value="+351">🇵🇹 Portugalsko (+351)</option>
            <option value="+352">🇱🇺 Lucembursko (+352)</option>
            <option value="+354">🇮🇸 Island (+354)</option>
            <option value="+358">🇫🇮 Finsko (+358)</option>
            <option value="+359">🇧🇬 Bulharsko (+359)</option>
            <option value="+370">🇱🇹 Litva (+370)</option>
            <option value="+372">🇪🇪 Estonsko (+372)</option>
            <option value="+385">🇭🇷 Chorvatsko (+385)</option>
            <option value="+386">🇸🇮 Slovinsko (+386)</option>
            <option value="+420" selected>🇨🇿 Česká republika (+420)</option>
            <option value="+421">🇸🇰 Slovensko (+421)</option>

        </select>

        <input type="text" id="telefon" placeholder="123 456 789" required>

    </div>

    <div style="margin-top:15px;">

        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
            <input type="checkbox" id="osobne" onchange="toggleOsobne()" style="width:auto; margin:0;">
            Osobně - Prodejna
        </label>

    </div>

    <div id="adresa-blok">

        <label>Ulice a číslo</label>
        <input type="text" id="ulice" placeholder="Daliborova 432/3">

        <label>Město</label>
        <input type="text" id="mesto" placeholder="Ostrava">

        <label>PSČ</label>
        <input type="text" id="psc" placeholder="12345">

        <label>Stát</label>

        <select id="stat">

            <option>Belgie</option>
            <option>Bulharsko</option>
            <option selected>Česká republika</option>
            <option>Dánsko</option>
            <option>Estonsko</option>
            <option>Finsko</option>
            <option>Francie</option>
            <option>Chorvatsko</option>
            <option>Island</option>
            <option>Itálie</option>
            <option>Litva</option>
            <option>Lucembursko</option>
            <option>Maďarsko</option>
            <option>Německo</option>
            <option>Norsko</option>
            <option>Polsko</option>
            <option>Portugalsko</option>
            <option>Rakousko</option>
            <option>Rumunsko</option>
            <option>Řecko</option>
            <option>Slovensko</option>
            <option>Slovinsko</option>
            <option>Španělsko</option>
            <option>Švédsko</option>
            <option>Švýcarsko</option>

        </select>

    </div>

    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:20px;
        "
    >

        <span style="font-weight:bold;">
            Značka a model
        </span>

        <label
            style="
                display:flex;
                align-items:center;
                gap:8px;
                margin:0;
                cursor:pointer;
                font-weight:normal;

                border:1px solid #dcdcdc;
                border-radius:10px;

                padding:8px 12px;

                background:#fafafa;
            "
        >

            <input
                type="checkbox"
                id="ostatni-model"
                onchange="toggleModelInput()"
                style="
                    width:auto;
                    margin:0;
                "
            >

            Ostatní

        </label>

    </div>

    <div id="model-select-blok">

        <select id="model" required>

            <option value="" disabled selected>
                Vyberte model
            </option>

            <option disabled>--- Teverun ---</option>
            <option>Teverun Blade Q Pro</option>
            <option>Teverun Blade Mini Single</option>
            <option>Teverun Blade Mini</option>
            <option>Teverun Blade Mini Pro</option>
            <option>Teverun Blade Mini Ultra</option>
            <option>Teverun Blade GT Single</option>
            <option>Teverun Blade GT</option>
            <option>Teverun Blade GT+</option>
            <option>Teverun Blade GT II</option>
            <option>Teverun Blade GT II+</option>
            <option>Teverun Fighter Q</option>
            <option>Teverun Fighter Mini</option>
            <option>Teverun Fighter Mini Eco</option>
            <option>Teverun Fighter Mini Std</option>
            <option>Teverun Fighter Mini Pro</option>
            <option>Teverun Fighter Eleven</option>
            <option>Teverun Fighter Eleven+</option>
            <option>Teverun Fighter Supreme Ultra</option>
            <option>Teverun Fighter Supreme 7260R</option>
            <option>Teverun Space Lite</option>
            <option>Teverun Space Std</option>

            <option disabled>--- Vsett ---</option>
            <option>Vsett Mini</option>
            <option>Vsett 8</option>
            <option>Vsett 8+</option>
            <option>Vsett 9</option>
            <option>Vsett 9+</option>
            <option>Vsett 10</option>
            <option>Vsett 10+</option>
            <option>Vsett 11+</option>
            <option>Vsett 8 Apex</option>
            <option>Vsett 9 Apex</option>
            <option>Vsett 10 Apex</option>

            <option disabled>--- Techlife ---</option>
            <option>Techlife X5</option>
            <option>Techlife X5S</option>
            <option>Techlife X6</option>
            <option>Techlife L5</option>
            <option>Techlife L5T</option>
            <option>Techlife X7</option>
            <option>Techlife X7S</option>
            <option>Techlife X7 Lite</option>
            <option>Techlife X8</option>
            <option>Techlife X8S</option>
            <option>Techlife X9</option>

        </select>

    </div>

    <div id="model-input-blok" style="display:none;">

        <input
            type="text"
            id="model-input"
            placeholder="Např. Vsett 10+"
        >

    </div>

    <label>Sériové číslo</label>
    <input type="text" id="seriove" placeholder="TDE1FMA25L9999">

    <label>Číslo faktury</label>
    <input type="text" id="faktura" placeholder="20261234">

    <label>Celkový nájezd (km)</label>
    <input type="number" id="najezd" placeholder="128">

    <label>Typ opravy</label>

    <select id="oprava" required>
        <option>Záruční</option>
        <option>Placená</option>
        <option>Kombinovaná</option>
    </select>

    <label>Popis závady</label>

    <textarea
        id="zavada"
        placeholder="Např. Koloběžka nejde nastartovat..."
        required
    ></textarea>

    <label>Poznámky</label>

    <textarea
        id="poznamky"
        placeholder="Dodatečné informace..."
    ></textarea>

    <button type="button" onclick="vygenerovatDOCX()">
        Stáhnout dokument
    </button>

</div>

<script>

function toggleOsobne() {

    const checkbox = document.getElementById('osobne');
    const adresaBlok = document.getElementById('adresa-blok');

    if (checkbox.checked) {
        adresaBlok.style.display = 'none';
    } else {
        adresaBlok.style.display = 'block';
    }
}

function toggleModelInput() {

    const checkbox = document.getElementById('ostatni-model');

    const selectBlok = document.getElementById('model-select-blok');

    const inputBlok = document.getElementById('model-input-blok');

    if (checkbox.checked) {

        selectBlok.style.display = 'none';
        inputBlok.style.display = 'block';

        document.getElementById('model').required = false;
        document.getElementById('model-input').required = true;

    } else {

        selectBlok.style.display = 'block';
        inputBlok.style.display = 'none';

        document.getElementById('model').required = true;
        document.getElementById('model-input').required = false;

    }
}

async function vygenerovatDOCX() {

    try {

        const response = await fetch('servis.docx');

        if (!response.ok) {
            alert('Nepodařilo se načíst servis.docx');
            return;
        }

        const arrayBuffer = await response.arrayBuffer();

        const zip = new PizZip(arrayBuffer);

        const doc = new window.docxtemplater(zip, {
            paragraphLoop: true,
            linebreaks: true
        });

        const osobne = document.getElementById('osobne').checked;

        doc.render({

            cislo_excel: document.getElementById('cislo_excel').value,

            zakaznik: document.getElementById('zakaznik').value,

            email: document.getElementById('email').value,

            telefon:
                document.getElementById('predvolba').value +
                ' ' +
                document.getElementById('telefon').value,

            ulice: osobne
                ? 'Osobně - Prodejna'
                : document.getElementById('ulice').value,

            mesto: osobne
                ? ''
                : document.getElementById('mesto').value,

            psc: osobne
                ? ''
                : document.getElementById('psc').value,

            stat: osobne
                ? ''
                : document.getElementById('stat').value,

            model:

                document.getElementById('model-select-blok').style.display === 'none'

                    ? document.getElementById('model-input').value

                    : document.getElementById('model').value,

            seriove: document.getElementById('seriove').value,

            faktura: document.getElementById('faktura').value,

            najezd: document.getElementById('najezd').value,

            oprava: document.getElementById('oprava').value,

            zavada: document.getElementById('zavada').value,

            poznamky: document.getElementById('poznamky').value

        });

        const output = doc.getZip().generate({

            type: 'blob',

            mimeType:
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

        });

        const cislo =
            document.getElementById('cislo_excel').value || 'bez-cisla';

        const zakaznik =
            document.getElementById('zakaznik').value || 'zakaznik';

        const filename = `${cislo} - ${zakaznik}.docx`;

        saveAs(output, filename);

    } catch (error) {

        console.error(error);
        alert('Chyba při generování dokumentu.');

    }
}

</script>

</body>
</html>
