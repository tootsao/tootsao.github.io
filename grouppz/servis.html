<!DOCTYPE html>
<html lang="cs"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Servisní hlášení</title>
        <link rel="icon" type="image/png" href="favicon.png">

        <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
        <script
            src="https://unpkg.com/docxtemplater@3.37.11/build/docxtemplater.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

        <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 120px;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            background: white;
            border:1px solid #d9d9d9;
            color: #111;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(0.96);
        }

        .theme-toggle{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    border:1px solid #d0d0d0;
    background:white;
    color:#111;
    cursor:pointer;
    z-index:999;
    transition:.25s;
}

.theme-toggle:hover{
    transform:rotate(180deg);
}

.theme-toggle:active{
    transform:scale(.9);
}

body.dark-mode{
    background:#121212;
    color:#fff;
}

body.dark-mode .container{
    background:#1e1e1e;
}

body.dark-mode input,
body.dark-mode textarea,
body.dark-mode select{
    background:#2a2a2a;
    color:white;
    border-color:#444;
}

body.dark-mode button{
    background:#2a2a2a;
    color:white;
    border-color:#444;
}

body.dark-mode button:hover{
    background:#333;
    color:white;
    filter:none;
}

.ostatni-model-label{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    cursor:pointer;
    font-weight:normal;
    border:1px solid #dcdcdc;
    border-radius:10px;
    padding:8px 12px;
    background:#fafafa;
}

body.dark-mode .ostatni-model-label{
    background:#2a2a2a;
    border-color:#444;
    color:white;
}

body.dark-mode .theme-toggle{
    background:#2a2a2a;
    border-color:#444;
    color:white;
}

body.dark-mode .theme-toggle:hover{
    background:#333;
}


    </style>
    </head>
    <body class="dark-mode">

                        <option value="+45">🇩🇰 +45</option>

                        <option value="+47">🇳🇴 +47</option>
                        <option value="+48">🇵🇱 +48</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+351">🇵🇹 +351</option>
                        <option value="+352">🇱🇺 +352</option>
                        <option value="+354">🇮🇸 +354</option>

        <button id="themeToggle" class="theme-toggle">☀️</button>

        <script>

function toggleOsobne() {

    const checkbox = document.getElementById('osobne');

    const adresaBlok = document.getElementById('adresa-blok');

    const ulice = document.getElementById('ulice');
    const mesto = document.getElementById('mesto');
    const psc = document.getElementById('psc');
    const stat = document.getElementById('stat');

    if (checkbox.checked) {

        adresaBlok.style.display = 'none';

        ulice.required = false;
        mesto.required = false;
        psc.required = false;
        stat.required = false;

    } else {

        adresaBlok.style.display = 'block';

        ulice.required = true;
        mesto.required = true;
        psc.required = true;
        stat.required = true;

    }
}

function toggleModelInput() {

    const checkbox = document.getElementById('ostatni-model');

    const selectBlok = document.getElementById('model-select-blok');

    const inputBlok = document.getElementById('model-input-blok');

    if (checkbox.checked) {

        selectBlok.style.display = 'none';
        inputBlok.style.display = 'block';

        document.getElementById('model').required = false;
        document.getElementById('model-input').required = true;

    } else {

        selectBlok.style.display = 'block';
        inputBlok.style.display = 'none';

        document.getElementById('model').required = true;
        document.getElementById('model-input').required = false;

    }
}

async function vygenerovatDOCX() {

    try {

        const response = await fetch('servis.docx');

        if (!response.ok) {
            alert('Nepodařilo se načíst servis.docx');
            return;
        }

        const arrayBuffer = await response.arrayBuffer();

        const zip = new PizZip(arrayBuffer);

        const doc = new window.docxtemplater(zip, {
            paragraphLoop: true,
            linebreaks: true
        });

        const osobne = document.getElementById('osobne').checked;


        const excelCislo =
            document.getElementById('cislo_excel').value || 'XXX';

        const zakaznik =
            document.getElementById('zakaznik').value || 'XXX';

        const ostatniModel =
            document.getElementById('ostatni-model').checked;

        const vybranyModel =
            document.getElementById('model').value || '';

        const jeTeverun =
            vybranyModel.startsWith('Teverun');

        const cislo =
            (ostatniModel || (!jeTeverun && vybranyModel !== ''))
                ? `Ostatní - ${excelCislo}`
                : excelCislo;

        const filename =
            cislo.startsWith('Ostatní')
                ? `O${excelCislo} - ${zakaznik}.docx`
                : `${excelCislo} - ${zakaznik}.docx`;

        doc.render({

            cislo_excel: cislo,

            zakaznik: document.getElementById('zakaznik').value,

            email: document.getElementById('email').value,

            telefon:
                document.getElementById('predvolba').value + ' ' + document.getElementById('telefon').value,

            ulice: osobne
                ? 'Osobně - Prodejna'
                : document.getElementById('ulice').value,

            adresa: osobne
            ? 'Osobně - Prodejna'
            : `${document.getElementById('ulice').value}, ${document.getElementById('mesto').value}, ${document.getElementById('psc').value}, ${document.getElementById('stat').value}`,

            model:

                document.getElementById('model-select-blok').style.display === 'none'

                    ? document.getElementById('model-input').value

                    : document.getElementById('model').value,

            seriove: document.getElementById('seriove').value || 'Nevím',

            faktura: document.getElementById('faktura').value || 'Nevím',

            najezd: document.getElementById('najezd').value  + ' km' || 'Nevím',

            oprava: document.getElementById('oprava').value,

            zavada: document.getElementById('zavada').value,

            poznamky: document.getElementById('poznamky').value

        });

        const output = doc.getZip().generate({

            type: 'blob',

            mimeType:
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

        });

        saveAs(output, filename);

    } catch (error) {

        console.error(error);
        alert('Chyba při generování dokumentu.');

    }
}

const themeToggle =
    document.getElementById('themeToggle');

function setTheme(theme){

    document.body.classList.toggle(
        'dark-mode',
        theme === 'dark'
    );

    themeToggle.textContent =
        theme === 'dark'
            ? '☀️'
            : '🌙';
}

const savedTheme =
    localStorage.getItem('theme');

if(savedTheme){

    setTheme(savedTheme);

}else{

    setTheme(
        window.matchMedia(
            '(prefers-color-scheme: dark)'
        ).matches
            ? 'dark'
            : 'light'
    );
}

themeToggle.addEventListener('click',()=>{

    const dark =
        document.body.classList.contains(
            'dark-mode'
        );

    const newTheme =
        dark ? 'light' : 'dark';

    setTheme(newTheme);

    localStorage.setItem(
        'theme',
        newTheme
    );

});

</script>
