<script>

function toggleOsobne() {

    const osobne = document.getElementById('osobne').checked;

    const osobneBlok = document.getElementById('osobne-blok');
    const kuryrBlok = document.getElementById('kuryr-blok');

    if(osobne){
        osobneBlok.style.display = 'block';
        kuryrBlok.style.display = 'none';

        document.getElementById('datum_predani').required = true;
        document.getElementById('datum_prevzeti').required = false;
        document.getElementById('datum_vyzvednuti').required = false;
    }else{
        osobneBlok.style.display = 'none';
        kuryrBlok.style.display = 'block';

        document.getElementById('datum_predani').required = false;
        document.getElementById('datum_prevzeti').required = true;
        document.getElementById('datum_vyzvednuti').required = true;
    }
}

function toggleModelInput() {

    const checkbox = document.getElementById('ostatni-model');

    const selectBlok = document.getElementById('model-select-blok');

    const inputBlok = document.getElementById('model-input-blok');

    if (checkbox.checked) {

        selectBlok.style.display = 'none';
        inputBlok.style.display = 'block';

        document.getElementById('model').required = false;
        document.getElementById('model-input').required = true;

    } else {

        selectBlok.style.display = 'block';
        inputBlok.style.display = 'none';

        document.getElementById('model').required = true;
        document.getElementById('model-input').required = false;

    }
}


function createDynamicList(containerId, className, placeholder){

    const container = document.getElementById(containerId);

    function ensureLastEmpty(){
        const inputs = [...container.querySelectorAll('input')];

        if(inputs.length === 0 || inputs[inputs.length-1].value.trim() !== ''){
            addRow('');
        }

        const all = [...container.querySelectorAll('input')];

        all.forEach((inp,index)=>{
            if(inp.value.trim()==='' && index !== all.length-1){
                inp.remove();
            }
        });
    }

    function addRow(value=''){
        const input = document.createElement('input');
        input.type = 'text';
        input.className = className;
        input.placeholder = placeholder;
        input.value = value;

        input.addEventListener('input', () => {
            ensureLastEmpty();
        });

        container.appendChild(input);
    }

    addRow('');
}

window.addEventListener('DOMContentLoaded', () => {
    createDynamicList('opravy','oprava-item','Např. Výměna displeje');
    createDynamicList('dily','dil-item','Např. TFT displej');
    toggleOsobne();
});

function formatDatum(datum) {
    if (!datum) return '';

    const d = new Date(datum);

    return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`;
}

async function vygenerovatDOCX() {

    try {

        const response = await fetch('protokol.docx');

        if (!response.ok) {
            alert('Nepodařilo se načíst protokol.docx');
            return;
        }

        const arrayBuffer = await response.arrayBuffer();

        console.log("PizZip =", window.PizZip);
console.log("docxtemplater =", window.docxtemplater);

        const zip = new PizZip(arrayBuffer);

        const doc = new window.docxtemplater(zip, {
            paragraphLoop: true,
            linebreaks: true
        });

        const osobne = document.getElementById('osobne').checked;


        const excelCislo =
            document.getElementById('cislo_excel').value || 'XXX';

        const zakaznik =
            document.getElementById('zakaznik').value || 'XXX';

        const ostatniModel =
            document.getElementById('ostatni-model').checked;

        const vybranyModel =
            document.getElementById('model').value || '';

        const jeTeverun =
            vybranyModel.startsWith('Teverun');

        const cislo =
            (ostatniModel || (!jeTeverun && vybranyModel !== ''))
                ? `Ostatní - ${excelCislo}`
                : excelCislo;

        const filename =
            cislo.startsWith('Ostatní')
                ? `O${excelCislo} - ${zakaznik}.docx`
                : `${excelCislo} - ${zakaznik}.docx`;

        const opravy = [...document.querySelectorAll('.oprava-item')]
    .map(x => ({text:x.value.trim()}))
    .filter(x => x.text);

        const dily = [...document.querySelectorAll('.dil-item')]
    .map(x => ({text:x.value.trim()}))
    .filter(x => x.text);

        doc.render({

            cislo: cislo,

            zakaznik: document.getElementById('zakaznik').value,

            email: document.getElementById('email').value,

            telefon:
                document.getElementById('predvolba').value + ' ' + document.getElementById('telefon').value,

            
            model:

                document.getElementById('model-select-blok').style.display === 'none'

                    ? document.getElementById('model-input').value

                    : document.getElementById('model').value,

            seriove: document.getElementById('seriove').value || 'Nevím',

            
            
            
            zavada: document.getElementById('zavada').value,

            poznamky: document.getElementById('poznamky').value,
            osobne: osobne,
            datum_predani: formatDatum(document.getElementById('datum_predani')?.value),
            datum_prevzeti: formatDatum(document.getElementById('datum_prevzeti')?.value),
            datum_vyzvednuti: formatDatum(document.getElementById('datum_vyzvednuti')?.value),
            opravy: opravy,
            dily: dily

        });

        const output = doc.getZip().generate({

            type: 'blob',

            mimeType:
                'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

        });

        saveAs(output, filename);

    } catch (error) {

        console.error(error);
        alert('Chyba při generování dokumentu.');

    }
}

const themeToggle =
    document.getElementById('themeToggle');

function setTheme(theme){

    document.body.classList.toggle(
        'dark-mode',
        theme === 'dark'
    );

    themeToggle.textContent =
        theme === 'dark'
            ? '☀️'
            : '🌙';
}

const savedTheme =
    localStorage.getItem('theme');

if(savedTheme){

    setTheme(savedTheme);

}else{

    setTheme(
        window.matchMedia(
            '(prefers-color-scheme: dark)'
        ).matches
            ? 'dark'
            : 'light'
    );
}

themeToggle.addEventListener('click',()=>{

    const dark =
        document.body.classList.contains(
            'dark-mode'
        );

    const newTheme =
        dark ? 'light' : 'dark';

    setTheme(newTheme);

    localStorage.setItem(
        'theme',
        newTheme
    );

});


const returnButton = document.getElementById('returnButton');
if(returnButton){
    returnButton.addEventListener('click', () => window.location.href='index.html');
}
</script>
